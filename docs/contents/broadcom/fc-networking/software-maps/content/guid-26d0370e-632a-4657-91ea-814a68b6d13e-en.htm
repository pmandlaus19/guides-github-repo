<!--?xml version="1.0" encoding="utf-8" ?--><!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml"><head><link rel="stylesheet" type="text/css" href="../../../../_rhdefault.css"></head><body id="v26064833" data-tcx-attr-rev="rev@2" lang="en-US" class="topic task" data-attr-rev="2"><div class="breadcrumbs"><div></div></div><h1 id="GUID-BFB9ECE3-29E4-42C8-B8D7-926BD88184D2" class="title">Clearing Quarantined Ports</h1><div id="GUID-48C8D53B-71C6-45D8-9262-B194E31A0F43" class="shortdesc" data-attr-status="changed"><div><div><span>MAPS allows you to remove ports which are quarantined from the quarantine group (ALL_QUARANTINED_GROUP). If the slow-draining behavior is not detected for a period, you can configure MAPS to automatically remove the quarantined ports from the quarantine group.</span></div></div></div></body></html>
