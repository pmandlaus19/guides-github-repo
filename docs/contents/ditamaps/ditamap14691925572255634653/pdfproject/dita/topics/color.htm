<!--?xml version="1.0" encoding="utf-8" ?--><!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml"><head><link rel="stylesheet" type="text/css" href="../../../../../../_rhdefault.css"></head><body id="color" class="topic" lang="en_US"><div class="breadcrumbs"><div><div><a href=""></a></div><div><a href=""></a></div><div><a href="contents/ditamaps/ditamap14691925572255634653/pdfproject/dita/topics/color">color</a></div></div></div><h1 class="title">Color</h1><p>The color wheel allows the user to select a color. The hue, saturation, and value of the color can be selected separately. Long pressing the object, the color wheel changes to the next parameter of the color (hue, saturation, or value). A double click resets the current parameter.</p></body></html>
