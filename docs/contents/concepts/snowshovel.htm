<!--?xml version="1.0" encoding="utf-8" ?--><!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml"><head><link rel="stylesheet" type="text/css" href="../../_rhdefault.css"></head><body id="snowshovelconcept" lang="en-us" class="topic concept"><div class="breadcrumbs"><div><div><a href=""></a></div><div><a href="contents/concepts/snowshovel">Snow shovel</a></div></div></div><h1 class="title">Snow shovel</h1><div class="p"><div><div><span>Use the snow shovel to clear the drive way and side walk of snow in the winter. A good snow shovel has a straight, wide scoop and a strong handle. To help snow come off the scoop, spray the scoop with cooking spray.</span></div></div></div><div class="related-links"><div><div><span class="prefix-content">Related information</span><a class="link" href="../tasks/shovellingsnow" data-attr-format="dita" data-attr-href="../tasks/shovellingsnow.xml" data-attr-type="task"><span class="linktext display-inline">Shovelling snow</span></a></div></div></div></body></html>
