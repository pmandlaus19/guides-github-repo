<!--?xml version="1.0" encoding="utf-8" ?--><!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml"><head><link rel="stylesheet" type="text/css" href="../../_rhdefault.css"></head><body id="concept.dita_7dda274b-497d-11ed-b7d9-8960ce8de201" class="topic concept" lang="en_US"><div class="breadcrumbs"><div></div></div><h1 class="title">MA3056</h1><div class="shortdesc"><div><div><span>Invalid Selection - </span><em class="keyword varname">P1</em><span> - replace option requires all sessions (*)</span></div></div></div><p><b class="ph b display-inline">Reason:</b></p><p>When the User Copy option is used to replace an entire definition set, all sessions must be selected.</p><p><b class="ph b display-inline">System Action:</b></p><p>None.</p><p><b class="ph b display-inline">User Action:</b></p><p>Correct the copy Session ID and retry.</p></body></html>
