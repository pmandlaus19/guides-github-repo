<!--?xml version="1.0" encoding="utf-8" ?--><!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml"><head><link rel="stylesheet" type="text/css" href="../../_rhdefault.css"></head><body id="concept.dita_7df7a084-497d-11ed-a9ed-8960ce8de201" class="topic concept" lang="en_US"><div class="breadcrumbs"><div></div></div><h1 class="title">MA7017</h1><div class="shortdesc"><div><div><span>MAI EVENT LOGGING STARTED</span></div></div></div><p><b class="ph b display-inline">Reason:</b></p><p>A request to start logging MAI system events was successful. Note that events will only be logged if the MAI:NSI interface is also active, and MAI events are active.</p><p><b class="ph b display-inline">System Action:</b></p><p>SYSPARMS MAIEVLOG=YES issued.</p><p><b class="ph b display-inline">User Action:</b></p><p>None.</p></body></html>
