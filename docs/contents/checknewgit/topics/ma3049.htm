<!--?xml version="1.0" encoding="utf-8" ?--><!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml"><head><link rel="stylesheet" type="text/css" href="../../_rhdefault.css"></head><body id="concept.dita_7dd6cade-497d-11ed-b401-8960ce8de201" class="topic concept" lang="en_US"><div class="breadcrumbs"><div></div></div><h1 class="title">MA3049</h1><div class="shortdesc"><div><div><span>Conflicting option </span><em class="keyword varname">P1</em><span> - move pending</span></div></div></div><p><b class="ph b display-inline">Reason:</b></p><p>More than one M(ove), A(fter), or B(efore) line commands were active at the same time.</p><p><b class="ph b display-inline">System Action:</b></p><p>The move request is not actioned.</p><p><b class="ph b display-inline">User Action:</b></p><p>Erase the conflicting option and either reset or complete the pending move.</p></body></html>
