<!--?xml version="1.0" encoding="utf-8" ?--><!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml"><head><link rel="stylesheet" type="text/css" href="../../_rhdefault.css"></head><body id="concept.dita_7dc52802-497d-11ed-8825-8960ce8de201" class="topic concept" lang="en_US"><div class="breadcrumbs"><div></div></div><h1 class="title">MA3032</h1><div class="shortdesc"><div><div><span>MAI Session List for User ID </span><em class="keyword varname">P1</em><span> not found</span></div></div></div><p><b class="ph b display-inline">Reason:</b></p><p>A session list for the specified User ID (<em class="keyword varname">P1</em>) does not exist.</p><p><b class="ph b display-inline">System Action:</b></p><p>None.</p><p><b class="ph b display-inline">User Action:</b></p><p>Do <em class="keyword varname">one</em> of the following:</p><ul class="ul"><li class="li">Correct the User ID and retry </li><li class="li">Use the add option to create a new session list for the User ID </li></ul></body></html>
