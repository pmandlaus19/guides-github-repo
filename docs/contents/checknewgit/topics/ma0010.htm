<!--?xml version="1.0" encoding="utf-8" ?--><!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml"><head><link rel="stylesheet" type="text/css" href="../../_rhdefault.css"></head><body id="concept.dita_7da4d992-497d-11ed-9747-8960ce8de201" class="topic concept" lang="en_US"><div class="breadcrumbs"><div></div></div><h1 class="title">MA0010</h1><div class="shortdesc"><div><div><span>SESSION ID MUST BE SPECIFIED</span></div></div></div><p><b class="ph b display-inline">Reason:</b></p><p>An update command was requested for an MAI session definition, but no session id was entered.</p><p><b class="ph b display-inline">System Action:</b></p><p>The request is rejected.</p><p><b class="ph b display-inline">User Action:</b></p><p>Enter the id of the session to be updated as the first operand.</p></body></html>
