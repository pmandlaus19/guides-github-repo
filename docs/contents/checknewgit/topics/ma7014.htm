<!--?xml version="1.0" encoding="utf-8" ?--><!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml"><head><link rel="stylesheet" type="text/css" href="../../_rhdefault.css"></head><body id="concept.dita_7df546fe-497d-11ed-b32d-8960ce8de201" class="topic concept" lang="en_US"><div class="breadcrumbs"><div></div></div><h1 class="title">MA7014</h1><div class="shortdesc"><div><div><span>COMMAND ASSIGNED TO FUNCTION KEY </span><em class="keyword varname">P1</em><span> IS INVALID</span></div></div></div><p><b class="ph b display-inline">Reason:</b></p><p>Function key <em class="keyword varname">P1</em> was pressed on the MAI:NSI Defaults/Status panel and the command assigned to it was invalid.</p><p><b class="ph b display-inline">System Action:</b></p><p>The command is rejected.</p><p><b class="ph b display-inline">User Action:</b></p><p>Correct the setting of the function key and retry.</p></body></html>
