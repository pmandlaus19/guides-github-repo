<!--?xml version="1.0" encoding="utf-8" ?--><!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml"><head><link rel="stylesheet" type="text/css" href="../../_rhdefault.css"></head><body id="concept.dita_7dab14be-497d-11ed-8fdc-8960ce8de201" class="topic concept" lang="en_US"><div class="breadcrumbs"><div></div></div><h1 class="title">MA0018</h1><div class="shortdesc"><div><div><span>A UNIQUE SESSION IDENTIFIER IS REQUIRED</span></div></div></div><p><b class="ph b display-inline">Reason:</b></p><p>The session identifier chosen by default from the logon request conflicts with an existing session.</p><p><b class="ph b display-inline">System Action:</b></p><p>The request is rejected.</p><p><b class="ph b display-inline">User Action:</b></p><p>Enter a session identifier that is not already in use.</p></body></html>
