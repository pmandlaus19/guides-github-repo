<!--?xml version="1.0" encoding="utf-8" ?--><!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml"><head><link rel="stylesheet" type="text/css" href="../../_rhdefault.css"></head><body id="concept.dita_7de35898-497d-11ed-8b9c-8960ce8de201" class="topic concept" lang="en_US"><div class="breadcrumbs"><div></div></div><h1 class="title">MA3065</h1><div class="shortdesc"><div><div><span>No sessions present for </span><em class="keyword varname">P1</em><span> - enter new session details</span></div></div></div><p><b class="ph b display-inline">Reason:</b></p><p>The user has no session definitions. They may be entered now.</p><p><b class="ph b display-inline">System Action:</b></p><p>None.</p><p><b class="ph b display-inline">User Action:</b></p><p>Enter the session definition details using the <em class="keyword varname">File</em> or <em class="keyword varname">Save</em> command, or use the <em class="keyword varname">Cancel</em> command to cancel the request.</p></body></html>
