<!--?xml version="1.0" encoding="utf-8" ?--><!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml"><head><link rel="stylesheet" type="text/css" href="../../_rhdefault.css"></head><body id="concept.dita_7ddd42f4-497d-11ed-8f3d-8960ce8de201" class="topic concept" lang="en_US"><div class="breadcrumbs"><div></div></div><h1 class="title">MA3060</h1><div class="shortdesc"><div><div><span>Jump Key </span><em class="keyword varname">P1</em><span> has already been defined</span></div></div></div><p><b class="ph b display-inline">Reason:</b></p><p>An action has already been assigned to the function key.</p><p><b class="ph b display-inline">System Action:</b></p><p>The cursor is placed in the field in error and the field is highlighted.</p><p><b class="ph b display-inline">User Action:</b></p><p>Change one of the function key assignments that are duplicated.</p></body></html>
