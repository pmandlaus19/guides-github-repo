<!--?xml version="1.0" encoding="utf-8" ?--><!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml"><head><link rel="stylesheet" type="text/css" href="../../_rhdefault.css"></head><body id="concept.dita_7db32796-497d-11ed-ba1b-8960ce8de201" class="topic concept" lang="en_US"><div class="breadcrumbs"><div></div></div><h1 class="title">MA2001</h1><div class="shortdesc"><div><div><span>INVALID KEYWORD VALUE SPECIFIED, KEYWORD=</span><em class="keyword varname">P1</em><span> VALUE=</span><em class="keyword varname">P2</em></div></div></div><p><b class="ph b display-inline">Reason:</b></p><p>A parameter to $MACALL has failed validation. The keyword was<em class="keyword varname"> P1 </em>and the value rejected was <em class="keyword varname">P2</em>.</p><p><b class="ph b display-inline">System Action:</b></p><p>The function is not performed.</p><p><b class="ph b display-inline">User Action:</b></p><p>Refer the error to your system administrator.</p></body></html>
