<!--?xml version="1.0" encoding="utf-8" ?--><!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml"><head><link rel="stylesheet" type="text/css" href="../../../_rhdefault.css"></head><body id="PR03949-s01" class="h2 topic concept" lang="en_US" data-attr-outputclass="h2"><div class="breadcrumbs"><div></div></div><h1 id="GUID-50deffa8-72f4-4b04-9ae1-40d9540edb2d-en" class="h2 title" data-attr-outputclass="h2">Foreign drafts</h1><p>A Foreign Draft is a bank check or a form of payment in physical paper form that is drawn on a financial institution in a currency other than the client's account currency.</p></body></html>
